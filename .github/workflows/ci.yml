name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: docs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.13.1"
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --no-audit --no-fund
      - name: Check out the authoritative AI contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GapwiseHQ/ai
          ref: main
          path: .canonical-ai
          sparse-checkout: contracts
          persist-credentials: false
      - name: Verify the Docs consumer against AI
        run: npm run mcp-contract:check -- --source=.canonical-ai/contracts/mcp-live-surface.json
      - name: Validate docs content and types
        run: npm run check
      - name: Verify deployment security headers
        run: npm run audit:deployment-security
      - name: Audit production dependencies
        run: node scripts/audit-production-dependencies.mjs
      - name: Build production documentation
        run: npm run build
